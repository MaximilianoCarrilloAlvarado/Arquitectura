<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrar empleados</title>
    <link rel="stylesheet" href="/estilos.css">
    <script src="/empleados.js" defer></script>
</head>
<body>
    <main class="contenedor">
        <header class="introduccion">
            <h1>Administrar empleados</h1>
            <p>Consulta y organiza los registros del equipo.</p>
        </header>

        <section class="panel" aria-label="Lista de empleados">
            <div class="barra">
                <h2>Empleados</h2>
                <div class="acciones">
                    <button type="button" id="btnEliminarSeleccionados" class="boton boton-peligro">Eliminar seleccionados</button>
                    <button type="button" id="btnNuevo" class="boton boton-nuevo">+ Agregar empleado</button>
                </div>
            </div>

            <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

            <form id="formulario" class="formulario" hidden>
                <h3 id="tituloFormulario">Agregar empleado</h3>
                <div class="campos">
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" maxlength="100" required>
                    </div>
                    <div class="campo">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" name="edad" min="1" step="1" required>
                    </div>
                    <div class="campo">
                        <label for="salario">Salario</label>
                        <input type="number" id="salario" name="salario" min="0" max="99999999.99" step="0.01" required>
                    </div>
                </div>
                <p class="acciones-formulario">
                    <button type="submit" id="btnGuardar" class="boton boton-nuevo">Guardar</button>
                    <button type="button" id="btnCancelar" class="boton boton-secundario">Cancelar</button>
                </p>
            </form>

            <div class="tabla-desplazable">
                <table>
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="seleccionarTodos" aria-label="Seleccionar todos los empleados de esta página"></th>
                            <th scope="col">ID</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Edad</th>
                            <th scope="col">Salario</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>

            <nav id="paginacion" class="paginacion" aria-label="Paginación de empleados">
                <button type="button" id="btnAnterior">Anterior</button>
                <span id="numerosPagina" class="numeros-pagina"></span>
                <button type="button" id="btnSiguiente">Siguiente</button>
                <span id="infoPagina" class="info-pagina"></span>
            </nav>
        </section>
    </main>
</body>
</html>
