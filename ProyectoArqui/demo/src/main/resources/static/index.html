<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administrar Empleados</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="container">
        <!-- Encabezado con título y botones -->
        <div class="header">
            <h1>Manage Employees</h1>
            <div class="header-actions">
                <button type="button" class="btn btn-danger" id="btnEliminarSeleccionados">
                    <!-- Icono de basura opcional aquí -->
                    Delete
                </button>
                <button type="button" class="btn btn-success" id="btnNuevo">
                    <!-- Icono de + opcional aquí -->
                    Add New Employee
                </button>
            </div>
        </div>

        <p id="mensaje"></p>

        <!-- Formulario (oculto inicialmente) -->
        <form id="formulario" hidden>
            <h2 id="tituloFormulario">Agregar empleado</h2>
            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" maxlength="100" required>
            </p>
            <p>
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="1" step="1" required>
            </p>
            <p>
                <label for="salario">Salario:</label>
                <input type="number" id="salario" name="salario" min="0" step="0.01" required>
            </p>
            <p>
                <button type="submit" class="btn btn-success">Guardar</button>
                <button type="button" id="btnCancelar" class="btn btn-danger">Cancelar</button>
            </p>
        </form>

        <!-- Tabla -->
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" id="seleccionarTodos" title="Seleccionar todos los de esta página"></th>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Edad</th>
                    <th>Salario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>

        <!-- Paginación -->
        <p id="paginacion">
            <button type="button" id="btnAnterior">Anterior</button>
            <span id="numerosPagina"></span>
            <button type="button" id="btnSiguiente">Siguiente</button>
            <span id="infoPagina"></span>
        </p>
    </div>

    <!-- JS externo -->
    <script src="/app.js"></script>
</body>
</html>
